name: Examples Gallery

# Refresh the committed sample cards under examples/ by running this action on
# itself. Dogfooding: the README gallery is real output from the live profile,
# and a scheduled run doubles as a canary on the GraphQL queries and the
# rendering pipeline.
on:
  push:
    branches: [main]
  schedule:
    # Monthly is enough to keep the samples representative without churning the
    # history — the contributions card stamps every render, so no run is a no-op.
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions: {}

# One repository-wide lock shared with every other workflow that writes to main.
# Concurrency groups match by name across the whole repository, so the shared
# name is what stops this refresh from racing the release — the group it used to
# have serialized it against itself only, which is precisely why the two kept
# colliding.
#
# Never cancel in progress: a cancelled run could drop a push that a later run
# has no reason to redo (the timestamp diff alone does not signal stale data).
# `queue: max` rather than the default `queue: single`, under which a pending
# refresh — including the monthly cron one — is silently cancelled and replaced
# when a third run arrives. All members of a shared group must declare identical
# settings; the documentation does not say whose values govern when they differ.
concurrency:
  group: main-writer
  cancel-in-progress: false
  queue: max

jobs:
  refresh-examples:
    name: Refresh Examples
    runs-on: ubuntu-latest
    # Forks have neither the App credentials nor a reason to publish samples of
    # this profile.
    if: github.repository == 'seijikohara/profile-cards-action'
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DEV_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.DEV_AUTOMATION_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Persist the App token so the commit step can push: main requires
          # pull requests, and only the App bypasses that rule. Every step in
          # this job runs first-party code from main, so leaving the credential
          # in .git/config exposes it to nothing a fork controls.
          token: ${{ steps.app-token.outputs.token }}

      - name: Render example cards
        uses: ./
        with:
          # The default runner token is all the GraphQL profile query needs.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: seijikohara
          output-dir: examples
          cards: overview,lifetime,contributions,composition,rhythm,cadence,languages
          themes: light,dark
          # Three brands simple-icons carries plus one it does not, so the
          # gallery shows both pill shapes: with a glyph and text-only.
          badges: |
            GitHub
            TypeScript
            npm
            Findy
          # The action's own commit path would author the commit itself. Commit
          # in an explicit step instead, so this workflow controls the message —
          # specifically the mandatory [skip ci] marker below.
          commit: false

      - name: Commit refreshed examples
        # `on:` already limits this workflow to these three triggers; restating
        # the guard here keeps it next to the only step that writes to the repo.
        if: contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
        env:
          BOT_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          BOT_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain examples)" ]]; then
            echo "Examples are already up to date"
            echo "### Examples Gallery" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No changes — examples/ is already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add examples
          changed=$(git diff --cached --name-only -- examples | wc -l | tr -d ' ')

          # [skip ci] is mandatory here. A push authenticated with an App token
          # DOES retrigger workflows (unlike one made with GITHUB_TOKEN), and the
          # contributions card embeds a "REFRESHED <timestamp>" line, so every
          # run produces a diff no matter what the API returned. Without the
          # marker this workflow would trigger itself forever.
          commit_message="chore(examples): refresh generated gallery [skip ci]"
          git commit -m "$commit_message"

          # main can advance between checkout and push (a merge, a release bump),
          # which rejects the push as non-fast-forward. Do NOT rebase to recover:
          # the competing commit wrote the same files, and the timestamp line
          # above differs on every render, so a rebase conflicts on essentially
          # every race and `set -e` then aborts the step mid-rebase. Nothing needs
          # merging anyway — the tree just rendered is the answer whatever landed
          # meanwhile. Move onto the new tip keeping that tree, and re-commit it.
          pushed=false
          for attempt in 1 2 3; do
            if git push; then
              pushed=true
              break
            fi
            if (( attempt == 3 )); then
              break
            fi
            echo "Push attempt ${attempt} rejected; re-committing onto the latest ${GITHUB_REF_NAME}" >&2

            git fetch origin "$GITHUB_REF_NAME"
            git reset --mixed FETCH_HEAD
            git add examples
            if git diff --cached --quiet; then
              echo "The new tip already carries identical examples; nothing left to push"
              pushed=true
              changed=0
              break
            fi
            changed=$(git diff --cached --name-only -- examples | wc -l | tr -d ' ')
            git commit -m "$commit_message"
          done
          if [[ "$pushed" != "true" ]]; then
            echo "::error::Failed to push refreshed examples after 3 attempts"
            exit 1
          fi

          if [[ "$changed" == "0" ]]; then
            echo "Nothing left to push — a concurrent run landed identical examples"
            {
              echo "### Examples Gallery"
              echo ""
              echo "No changes — a concurrent run already pushed identical examples."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Pushed ${changed} refreshed file(s)"
          {
            echo "### Examples Gallery"
            echo ""
            echo "✅ Refreshed and pushed ${changed} file(s) under \`examples/\`."
          } >> "$GITHUB_STEP_SUMMARY"
