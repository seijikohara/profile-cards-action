name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Serialize CI per branch / PR so the bot's dist-commit push (and the
# subsequent main-side version bump) can't race a still-running earlier
# run and produce a non-fast-forward `git push`. `cancel-in-progress`
# leaves only the latest run alive; its checks are what auto-merge and
# branch protection evaluate against the current HEAD.
#
# Key on the pull request number, not the branch name. Two fork PRs can share a
# branch name (`patch-1` is the web UI's default) and would then cancel each
# other, stranding a required check as `cancelled` with nothing left to
# re-trigger it. Prefixing with `github.workflow` also stops this group from
# ever colliding with another workflow's — group names match repository-wide,
# not per workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          # The PR-side commit step pushes back to the PR branch HEAD, so
          # we need that exact commit instead of the synthetic merge ref
          # GitHub provides on `pull_request` events. For `push` events
          # head.sha is empty and we fall back to the pushed commit's SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Build steps below execute PR-supplied code (pnpm scripts, tsdown,
          # tests). Do not leave any privileged credentials behind in
          # .git/config that those scripts could exfiltrate. The App token
          # is minted in a later step and only added to the env of the
          # commit / release steps that need it.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        # pnpm 11 blocks dependency build scripts by default; only lefthook is
        # allow-listed in pnpm-workspace.yaml (allowBuilds). Combined with
        # persist-credentials: false on checkout and minting the App token only
        # after every PR-controlled build step has run, this keeps the token
        # out of reach of any dependency script.
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Package action
        # Rebuild dist/ and regenerate dist/licenses.txt so the freshness
        # check below compares the committed artifacts against a clean build.
        run: pnpm run package

      - name: Generate GitHub App Token
        # Only mint the privileged token after every PR-controlled build
        # step has run, and only when the one downstream step that needs it
        # will actually run. The token is then scoped to the explicit env of
        # that step via outputs. Pull requests only: releasing is release.yml's
        # job now, so CI writes nothing on main.
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DEV_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.DEV_AUTOMATION_PRIVATE_KEY }}

      - name: Commit dist to PR branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != format('{0}[bot]', steps.app-token.outputs.app-slug) }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          BOT_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          git config --global user.name "$BOT_NAME"
          git config --global user.email "$BOT_EMAIL"
          # persist-credentials: false above means git has no stored token for
          # github.com. Authenticate the pushes below by embedding the App token
          # in the remote URL; GitHub Actions automatically masks secrets in logs.
          authed_remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          for attempt in 1 2 3; do
            git add dist/
            if git diff --cached --quiet; then
              echo "No dist/ changes detected"
              exit 0
            fi
            git commit -qm "build: update generated files"

            if git push "$authed_remote" "HEAD:refs/heads/${PR_BRANCH}"; then
              echo "Committed dist/ to PR branch ${PR_BRANCH}"
              exit 0
            fi
            if (( attempt == 3 )); then
              break
            fi

            # The branch advanced mid-run — Renovate force-pushes a rebase when
            # its pull request falls behind the base. Recover by REBUILDING, not
            # by re-staging what is already on disk. This is the opposite of the
            # rendered-cards case in examples.yml, and the difference is the
            # point: dist/ is a pure function of src/ and the lockfile AT THE
            # SAME COMMIT, so a bundle built before the rebase paired with the
            # lockfile after it is genuinely wrong content. It would still merge
            # green, and because the resulting push is authored by the bot the
            # follow-up run skips this step, so nothing ever corrects it. A
            # rendered card has no such pairing — there the freshly rendered
            # tree is authoritative and re-staging is correct.
            echo "Push attempt ${attempt} rejected; rebuilding against the new head" >&2
            git fetch -q origin "$PR_BRANCH"
            git reset -q --hard FETCH_HEAD
            pnpm install --frozen-lockfile
            pnpm run package
          done

          echo "::error::Failed to push dist/ to ${PR_BRANCH} after 3 attempts"
          exit 1

  build-and-test-summary:
    name: Build and Test Summary
    runs-on: ubuntu-latest
    needs: build-and-test
    # GitHub branch protection treats a `skipped` required check as
    # non-failing, so the default `needs:` behavior (skip the summary when
    # the upstream job fails) lets red builds slip past required-check
    # rulesets. Always run the summary and turn the upstream conclusion
    # into an explicit pass/fail so it correctly gates merges.
    if: always()
    steps:
      - name: Fail if build-and-test did not succeed
        # A cancelled push run is expected on main: the group still resolves to
        # a single name there, so back-to-back merges supersede each other's
        # runs. Let that surface as `cancelled` instead of converting it into a
        # failure. PR runs keep failing on cancellation so the required check
        # stays strict.
        if: needs.build-and-test.result != 'success' && !(github.event_name == 'push' && needs.build-and-test.result == 'cancelled')
        run: |
          echo "::error::build-and-test concluded with '${{ needs.build-and-test.result }}'"
          exit 1
      - name: Report successful completion
        if: needs.build-and-test.result == 'success'
        run: |
          echo "### Build and Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Lint, format, type check, tests, and packaging completed successfully." >> $GITHUB_STEP_SUMMARY
