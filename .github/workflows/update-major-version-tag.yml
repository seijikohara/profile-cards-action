name: Update Release Tags

# Releases are cut by `release.yml`, which reconciles tags on every trigger.
# This workflow is the manual break-glass for the cases that reconciler will not
# handle: minting the initial bootstrap tag (it needs a prior release tag to
# diff against), and re-syncing the tags on demand without waiting for a push.
on:
  workflow_dispatch:

# Same repository-wide lock as the other writers to main. `cancel-in-progress`
# must be false here specifically: dispatched to repair a stuck release, a
# cancelling run could kill an in-flight release between its version-tag push
# and its major-tag move — manufacturing the half-applied state it was fired to
# fix. Every member of a shared group must declare identical settings.
concurrency:
  group: main-writer
  cancel-in-progress: false
  queue: max

jobs:
  update-release-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DEV_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.DEV_AUTOMATION_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Sync release tags
        uses: ./.github/actions/sync-release-tags
        with:
          bot-name: ${{ steps.app-token.outputs.app-slug }}[bot]
          bot-email: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          github-token: ${{ steps.app-token.outputs.token }}
