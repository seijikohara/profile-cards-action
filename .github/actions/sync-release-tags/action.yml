name: Sync release tags
description: Reconcile the v{version} tag and its GitHub Release with package.json, then force v{major} to point at the released commit.

inputs:
  bot-name:
    description: Git user name used to author the tag objects.
    required: true
  bot-email:
    description: Git user email used to author the tag objects.
    required: true
  github-token:
    description: 'Token used by the GitHub CLI to publish the Release. Needs `contents: write`.'
    required: true

runs:
  using: composite
  steps:
    - name: Sync release tags
      shell: bash
      env:
        BOT_NAME: ${{ inputs.bot-name }}
        BOT_EMAIL: ${{ inputs.bot-email }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        current_version=$(node -p "require('./package.json').version")
        current_commit=$(git rev-parse HEAD)
        version_tag="v${current_version}"
        # Strip everything from the first dot: for a 0.0.x pre-1.0 line this
        # yields the moving major tag `v0`.
        major_tag="v${current_version%%.*}"

        # The commit this release is anchored to. An existing v{version} tag is
        # immutable and wins: re-running against a later tip must re-point the
        # moving major tag at the released commit, never at whatever happens to
        # be checked out. That distinction is what makes this workflow usable as
        # a repair tool — in the steady state main's tip is an examples refresh
        # ahead of the release commit, so treating "tip != tagged commit" as an
        # error made a manual dispatch fail every time it was actually needed.
        existing_version_commit=""
        if git rev-parse --verify "refs/tags/${version_tag}" >/dev/null 2>&1; then
          existing_version_commit=$(git rev-list -n 1 "refs/tags/${version_tag}")
        fi
        target_commit="${existing_version_commit:-$current_commit}"

        git config --global user.name "$BOT_NAME"
        git config --global user.email "$BOT_EMAIL"

        # Caller workflows checkout with `persist-credentials: false` to
        # keep secrets out of .git/config while running PR-controlled
        # build steps. By the time this composite runs all that PR code is
        # behind us, so it is safe to swap the origin URL to one that
        # carries the App token for the tag pushes below.
        authed_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

        if [[ -z "$existing_version_commit" ]]; then
          git tag -a "${version_tag}" "${target_commit}" -m "chore(release): publish ${version_tag}"
          git push "${authed_remote}" "refs/tags/${version_tag}"
          version_status="created"
        else
          version_status="already existed"
        fi

        # Always re-point the major tag, even when nothing else changed: that is
        # the whole repair path. Anchoring it to target_commit rather than HEAD
        # guarantees v0 only ever names a commit that shipped as a v{version}
        # release, so consumers on @v0 cannot be handed an untagged tip.
        git tag -fa "${major_tag}" "${target_commit}" -m "chore(release): update ${major_tag} to ${version_tag}"
        git push --force "${authed_remote}" "refs/tags/${major_tag}"

        # Publish a GitHub Release for the patch tag the first time it shows
        # up. The major tag is deliberately left alone here: it is a moving
        # pointer, so a Release generated against it would describe whichever
        # patch happened to be current when it was cut and then go stale on the
        # next bump. A `v0` Release does exist — Marketplace publishes from a
        # Release, and the patch releases were already taken — but it is
        # maintained by hand and says only what the moving tag means. The check
        # is idempotent so re-runs (manual dispatch, retries) don't error.
        if gh release view "${version_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
          release_status="already existed"
        else
          gh release create "${version_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${version_tag}" \
            --generate-notes
          release_status="created"
        fi

        short_sha=$(git rev-parse --short "${target_commit}")
        {
          echo "### 📌 Release Tags"
          echo ""
          echo "| Tag | Commit SHA | Status |"
          echo "|-----|------------|--------|"
          echo "| \`${version_tag}\` | \`${short_sha}\` | ${version_status} |"
          echo "| \`${major_tag}\` | \`${short_sha}\` | force-updated |"
          echo ""
          echo "GitHub Release \`${version_tag}\`: ${release_status}."
        } >> "$GITHUB_STEP_SUMMARY"
