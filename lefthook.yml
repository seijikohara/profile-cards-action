pre-commit:
  jobs:
    - name: format staged files
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      glob: '*.{ts,js,mjs,cjs,json,md,yml,yaml}'
      exclude:
        - dist/**
      stage_fixed: true
    - name: lint staged files
      # oxlint exits 1 when .oxlintrc.json ignores every staged file (for
      # example under coverage/), so let it skip that case like oxfmt above.
      run: pnpm exec oxlint --no-error-on-unmatched-pattern --fix {staged_files}
      glob: '*.{ts,js,mjs,cjs}'
      exclude:
        - dist/**
      stage_fixed: true

pre-push:
  jobs:
    - name: lint
      run: pnpm lint
    - name: typecheck
      run: pnpm typecheck
